<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CTA 建築師考古題模擬測驗系統，提供標準測試與圖文並茂版本。">
    <title>CTA 建築師考古題模擬系統</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    
    <main class="container">
        <header class="header">
            <h1>建築師考古題模擬系統</h1>
            <p>請選擇您要進行測驗的版本，開啟專屬您的刷動態解題體驗。</p>
        </header>

        <div class="card-grid">
            <!-- Card 1 -->
            <a href="建築師考古題模擬練習.html" class="glass-card primary-card">
                <div class="card-content">
                    <div class="icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </div>
                    <h2>標準模擬練習</h2>
                    <p>標準題庫練習介面，適合快速刷題與自我測驗考科熟練度。具備高效率的單純作答體驗。</p>
                    <span class="btn-text">開始測驗 <span class="arrow">→</span></span>
                </div>
                <div class="card-bg"></div>
            </a>

            <!-- Card 2 -->
            <a href="建築師考古題模擬練習-圖文並茂版本.html" class="glass-card secondary-card">
                <div class="card-content">
                    <div class="icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </div>
                    <h2>圖文並茂版本</h2>
                    <p>加入圖表與圖像的豐富排版，更適合需要依賴視覺線索的題型，讓您圖解輕鬆讀。</p>
                    <span class="btn-text">開始測驗 <span class="arrow">→</span></span>
                </div>
                <div class="card-bg"></div>
            </a>
        </div>
        
        <footer class="site-footer">
            <p>&copy; 築匠建築師事務所(CTArch)</p>
            <div class="visitor-counter">
                <span class="visitor-counter-label">📊 網站觀看人次：</span>
                <div class="visitor-counter-box">
                    <div>今日 <strong id="cnt-today">...</strong></div>
                    <div class="sep">|</div>
                    <div>本月 <strong id="cnt-month">...</strong></div>
                    <div class="sep">|</div>
                    <div>年度 <strong id="cnt-year">...</strong></div>
                    <div class="sep">|</div>
                    <div>總計 <strong id="cnt-total">...</strong></div>
                </div>
            </div>
        </footer>
    </main>

    <script>
    /* 人次計數器（kvdb.io 累積，不歸零；沿用 CTA-GEM 官網同一個 bucket，換 archquiz_ 前綴避免混計） */
    (function () {
        var d = new Date();
        var yyyy = d.getFullYear();
        var mm = yyyy + '-' + String(d.getMonth() + 1).padStart(2, '0');
        var dd = mm + '-' + String(d.getDate()).padStart(2, '0');

        var bucket = 'UpdkEy78HzmGeeQsNQHcU2';
        var endpoint = 'https://kvdb.io/' + bucket + '/';

        var keys = ['archquiz_total', 'archquiz_yr_' + yyyy, 'archquiz_mo_' + mm, 'archquiz_dy_' + dd];
        var els = ['cnt-total', 'cnt-year', 'cnt-month', 'cnt-today'];

        var isNewHit = !sessionStorage.getItem('archquiz_hit_recorded');
        if (isNewHit) sessionStorage.setItem('archquiz_hit_recorded', '1');

        keys.forEach(function (key, idx) {
            var method = isNewHit ? 'PATCH' : 'GET';
            var body = isNewHit ? '+1' : null;
            fetch(endpoint + key, { method: method, body: body })
                .then(function (r) { return r.ok ? r.text() : '0'; })
                .then(function (v) {
                    document.getElementById(els[idx]).innerText = parseInt(v) || 0;
                })
                .catch(function (e) { console.error('Counter Error:', e); });
        });
    })();
    </script>
</body>
</html>
