<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CTA 建築師考古題模擬測驗系統，提供標準測試與圖文並茂版本。">
    <title>CTA 建築師考古題模擬系統</title>
    <link rel="stylesheet" href="style.css?v=20260828d">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <aside class="hero">
            <div class="hero-top">
                <span class="hero-eyebrow">CTA　建築師考試準備</span>
                <h1 class="hero-title">建築師<br>考古題<br>模擬系統</h1>
                <p class="hero-desc">請選擇您要進行測驗的版本，<br>開啟專屬您的刷題體驗。</p>
            </div>
            <footer class="hero-footer">
                <p>&copy; 築匠建築師事務所(CTArch)</p>
                <div class="visitor-counter">
                    <span class="visitor-counter-label">📊 觀看人次</span>
                    <div class="visitor-counter-box">
                        <div>今日 <strong id="cnt-today">...</strong></div>
                        <div class="sep">/</div>
                        <div>本月 <strong id="cnt-month">...</strong></div>
                        <div class="sep">/</div>
                        <div>年度 <strong id="cnt-year">...</strong></div>
                        <div class="sep">/</div>
                        <div>總計 <strong id="cnt-total">...</strong></div>
                    </div>
                </div>
            </footer>
        </aside>

        <main class="index-panel">
            <a href="建築師考古題模擬練習.html" class="index-row row-primary">
                <span class="index-num">01</span>
                <span class="index-body">
                    <span class="index-title">標準模擬練習</span>
                    <span class="index-desc">標準題庫練習介面，適合快速刷題與自我測驗考科熟練度。具備高效率的單純作答體驗。</span>
                </span>
                <span class="index-arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </span>
            </a>

            <a href="建築師考古題模擬練習-圖文並茂版本.html" class="index-row row-secondary">
                <span class="index-num">02</span>
                <span class="index-body">
                    <span class="index-title">圖文並茂版本</span>
                    <span class="index-desc">加入圖表與圖像的豐富排版，更適合需要依賴視覺線索的題型，讓您圖解輕鬆讀。</span>
                </span>
                <span class="index-arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </span>
            </a>
        </main>
    </div>

    <script>
    /* 人次計數器（kvdb.io 累積，不歸零；沿用 CTA-GEM 官網同一個 bucket，換 archquiz_ 前綴避免混計） */
    (function () {
        var d = new Date();
        var yyyy = d.getFullYear();
        var mm = yyyy + '-' + String(d.getMonth() + 1).padStart(2, '0');
        var dd = mm + '-' + String(d.getDate()).padStart(2, '0');

        var bucket = 'UpdkEy78HzmGeeQsNQHcU2';
        var endpoint = 'https://kvdb.io/' + bucket + '/';

        var keys = ['archquiz_total', 'archquiz_yr_' + yyyy, 'archquiz_mo_' + mm, 'archquiz_dy_' + dd];
        var els = ['cnt-total', 'cnt-year', 'cnt-month', 'cnt-today'];

        var isNewHit = !sessionStorage.getItem('archquiz_hit_recorded');
        if (isNewHit) sessionStorage.setItem('archquiz_hit_recorded', '1');

        keys.forEach(function (key, idx) {
            var method = isNewHit ? 'PATCH' : 'GET';
            var body = isNewHit ? '+1' : null;
            fetch(endpoint + key, { method: method, body: body })
                .then(function (r) { return r.ok ? r.text() : '0'; })
                .then(function (v) {
                    document.getElementById(els[idx]).innerText = parseInt(v) || 0;
                })
                .catch(function (e) { console.error('Counter Error:', e); });
        });
    })();
    </script>
</body>
</html>
